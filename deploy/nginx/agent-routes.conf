# Include inside the existing HTTPS server block for api.achanvear.site.
# The Python agent must listen on host port 8001 (docker compose ai-agent).
# Keep the existing Java /api/v1/ location unchanged.

location /practical-interview/ws/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location /practical-interview/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location /code-runner/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
}

location = /agent-health {
    proxy_pass http://127.0.0.1:8001/health;
}
