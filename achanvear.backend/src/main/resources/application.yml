spring:
  application:
    name: achanvear-backend
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/achanvear}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Lopez2003}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 17
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8081}
  servlet:
    context-path: /api/v1

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

security:
  jwt:
    access-token-expiration-minutes: 1440
    refresh-token-expiration-days: 7
    issuer: achanvear-backend
    private-key-path: ${JWT_PRIVATE_KEY_PATH:keys/private_key.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/public_key.pem}
    secret: ${JWT_SECRET:my-super-secret-key-min-32-chars-long-for-dev-only}
  password-reset:
    token-expiration-minutes: 30

apiperu:
  token: ${APIS_PERU_TOKEN:}
  base-url: ${APIS_PERU_BASE_URL:https://apiperu.dev/api}

aws:
  region: ${AWS_REGION:us-east-1}
  access-key: ${AWS_ACCESS_KEY_ID:}
  secret-key: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:achanvear-storage}
    bucket: ${AWS_S3_BUCKET_NAME:achanvear-storage}
    region: ${AWS_REGION:us-east-1}
    profile-photo-folder: freelancer/profile-photos
    curriculum-folder: freelancer/curriculums
    chat-attachments-folder: chat/attachments
    upload-expiration-minutes: 15
    download-expiration-minutes: 60

app:
  base-url: ${APP_BASE_URL:http://localhost:8081}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  external:
    ai-validator:
      base-url: ${AI_VALIDATOR_BASE_URL:http://localhost:8081}
  aws:
    s3:
      profile:
        bucket: ${AWS_S3_BUCKET_NAME:achanvear-storage}
        region: ${AWS_REGION:us-east-1}
        profile-photo-folder: profile/photos
        curriculum-folder: profile/curriculums
        portfolio-folder: profile/portfolio
        upload-expiration-minutes: 15
  mercadopago:
    access-token: ${MP_ACCESS_TOKEN:TEST-140685990943776-082500-4484eedb437f589364a5b1cdf3538dcf-3157090819}
    public-key: ${MP_PUBLIC_KEY:TEST-7c056e9c-ee8b-4711-b803-8f057abc5bb1}
    webhook-secret: ${MP_WEBHOOK_SECRET:test-secret}
    success-url: ${MP_SUCCESS_URL:http://localhost:8081/payments/success}
    failure-url: ${MP_FAILURE_URL:http://localhost:8081/payments/failure}
    pending-url: ${MP_PENDING_URL:http://localhost:8081/payments/pending}
  culqi:
    public-key: ${CULQI_PUBLIC_KEY:pk_test_3GaFfV2020niFpxr}
    secret-key: ${CULQI_SECRET_KEY:sk_test_PoHjHT7obOWW12yq}
    base-url: ${CULQI_BASE_URL:https://api.culqi.com/v2}
    currency-code: ${CULQI_CURRENCY_CODE:PEN}

brevo:
  api-key: ${BREVO_API_KEY:}
  sender:
    email: ${BREVO_SENDER_EMAIL:}
    name: ${BREVO_SENDER_NAME:Achanvear}

n8n:
  webhook:
    notifications-url: ${N8N_NOTIFICATIONS_WEBHOOK_URL:http://host.docker.internal:5678/webhook/notifications}

ai:
  api:
    url: ${AI_API_URL:http://localhost:8001}
  provider: ${AI_PROVIDER:groq}

groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
